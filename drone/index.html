function addVector(vec1, vec2) {
  return [vec1[0] + vec2[0], vec1[1] + vec2[1]]
}

function subVector(vec1, vec2) {
  return [vec1[0] - vec2[0], vec1[1] - vec2[1]]
}

function mulVector(vec1, vec2) {
  return [vec1[0] * vec2[0], vec1[1] * vec2[1]]
}

function divVector(vec1, vec2) {
  return [vec1[0] / vec2[0], vec1[1] / vec2[1]]
}

function minVector(vec1, vec2) {
  return [Math.min(vec1[0], vec2), Math.min(vec1[1], vec2)]
}

function lerp(A,B,t){
  return A+(B-A)*t;
}

function circle(x=50,y=50,rad=10,clr="orange") {
  ctx.beginPath();

  ctx.fill();
}

function line(x1=50,y1=50,x2=100,y2=100,clr="orange") {
  ctx.beginPath();

  ctx.lineWidth = 2;
  ctx.moveTo(x1,y1);
  ctx.lineTo(x2,y2);
  ctx.stroke();
}

function rect(x=50,y=50,w=10,h=10,clr="white") {
  ctx.beginPath();
  ctx.fillStyle = clr;
  ctx.rect(x,y, w,h);
  ctx.fill();
}

function text(x,y,text) {
  ctx.fillStyle = "white";
  ctx.globalAlpha = 1;
  ctx.font = "16px sans-serif";
  ctx.fillText(text, x,y);
}

function cross(v1,v2) {
  return v1[0] * v2[1] - v1[1] * v2[0];
}

function gaussianRandom() {
  let u = 0;
  let v = 0;

  while (u === 0) u = Math.random();
  while (v === 0) v = Math.random();

  return Math.sqrt(-2 * Math.log(u)) *
    Math.cos(2 * Math.PI * v);
}

  static crossover(dna1, dna2) {
    let child = JSON.parse(JSON.stringify(dna1)); // Deep copy parent1

    const child = JSON.parse(JSON.stringify(parentA)); // Create a deep copy of parent A

    // Determine the crossover point randomly within available layers
    const crossoverLayer = Math.floor(Math.random() * parentA.layers.length);

}

  static uniformCrossover(parentA, parentB) {
    const child = JSON.parse(JSON.stringify(parentA)); // Create a deep copy of parent A

    const crossoverLayer = Math.floor(Math.random() * parentA.layers.length);

    // Loop through each layer of the neural network
    for (let layerIndex = crossoverLayer; layerIndex < parentA.layers.length; layerIndex++) {
      const layerA = parentA.layers[layerIndex];
      const layerB = parentB.layers[layerIndex];

      // Uniformly swap biases
      layerA.biases.forEach((bias, i) => {

      });

      // Uniformly swap weights

        });

  static mutateParameters(network,
    {
      rate = 0.02,
      strength = 0.05,
      resetRate = 0.001,
      weightLimit = 5
    } = {}
  ) {
    function mutateValue(value) {
      if (Math.random() < resetRate) {
        return Math.random() * 2 - 1;
      }

      if (Math.random() >= rate) {
        return value;
      }

      value += gaussianRandom() * strength;

      return Math.max(
        -weightLimit,
        Math.min(weightLimit, value)
      );
    }

    for (const layer of network.layers) {
      for (let i = 0; i < layer.biases.length; i++) {
        layer.biases[i] =
          mutateValue(layer.biases[i]);
      }

      for (let input = 0;
          input < layer.weights.length;
          input++) {
        for (let output = 0;
            output < layer.weights[input].length;
            output++) {
          layer.weights[input][output] =
            mutateValue(
              layer.weights[input][output]
            );
        }
      }
    }
  }

  static chooseMutationSettings() {
    const roll = Math.random();

    // Fine-tuning children.
    if (roll < 0.70) {
      return {
        rate: 0.05,
        strength: 0.05,
        resetRate: 0

    }

    // Medium exploration.
    if (roll < 0.95) {

        rate: 0.14,
        strength: 0.20,
        resetRate: 0.001

    // A few aggressive explorers.
    return {

    // Randomly determine the number of layers
    const numLayers = Math.floor(Math.random() * (maxLayers - minLayers + 1)) + minLayers;
    const neuronsArray = [];

    // Generate random number of neurons for each layer
    for (let i = 0; i < numLayers; i++) {
        const numNeurons = Math.floor(Math.random() * (maxNeurons - minNeurons + 1)) + minNeurons;
        neuronsArray.push(numNeurons);
    }

    return neuronsArray;
  }

    if (plotHistory.length === 0) return; // Prevent plotting if there are no points

    const max = Math.max(...plotHistory);
    const min = Math.min(...plotHistory);
    const plotWidth = 400;
    const plotHeight = 200;
    const offset = 50;
    const plotX = windowWidth - offset - plotWidth;

    // Clear the previous plot
    rect(plotX, 20, plotWidth, plotHeight, "white");
    line(plotX + 20, 20 + 20, plotX + 20, plotHeight, "black");
    line(plotX + 20, plotHeight, plotX + plotWidth - 25, plotHeight, "black");

    const scalingFactor = (plotHeight - 40) / (max - min);

    // Iterate through points and draw the lines
    for (let i = 0; i < plotHistory.length - 1; i++) {
        const x1 = plotX + (plotWidth / (plotHistory.length - 1)) * i;
        const y1 = (plotHeight - ((plotHistory[i] - min) * scalingFactor));
       
        const x2 = plotX + (plotWidth / (plotHistory.length - 1)) * (i + 1);
        const y2 = (plotHeight - ((plotHistory[i + 1] - min) * scalingFactor));
       
        line(x1, y1, x2, y2, "black");
    }
  }

// LAYER
class Layer {
  constructor(inputNeurons, outputNeurons) {
    this.inputs = new Array(inputNeurons);
   
    this.outputs = new Array(outputNeurons);
    this.biases = new Array(outputNeurons);

    this.weights = [];
    for (var i = 0; i<inputNeurons; i++) {
      this.weights[i] = new Array(outputNeurons);
    }

    Layer.random(this);

  }

  // static random(layer) {
  //   for (let i = 0; i < layer.inputs.length; i++) {
  //     for (let j = 0; j < layer.outputs.length; j++) {
  //       layer.weights[i][j] = Math.random()*2-1;
  //       // layer.weights[i][j] = Math.random()*4 - 2;
  //     }
  //   }

  //   for (let i = 0; i < layer.biases.length; i++) {
  //     layer.biases[i] = Math.random()*2-1;
  //     // layer.biases[i] = Math.random()*4 - 2;
  //   }
  // }

  static random(layer) {
    const inputCount = layer.inputs.length;
    const outputCount = layer.outputs.length;
    const limit = Math.sqrt(6 / (inputCount + outputCount));

    for (let input = 0; input < inputCount; input++) {
      for (let output = 0; output < outputCount; output++) {
        layer.weights[input][output] =
          (Math.random() * 2 - 1) * limit;
      }
    }

    // Starting biases at zero reduces immediate saturation.
    layer.biases.fill(0);
  }

  static feedForwardLayer(inputs, layer, binary=false) {
    const inputCount = inputs.length;
    const outputCount = layer.outputs.length;
    const weights = layer.weights;
    const biases = layer.biases;
    const outputs = layer.outputs;

    for (let outputN = 0; outputN < outputCount; outputN++) {

      let sum = biases[outputN];
      // row-major: weights[input][output]
      
      for (let inputN = 0; inputN < inputCount; inputN++) {
        sum += inputs[inputN]*weights[inputN][outputN];
      }


      outputs[outputN] = NN.tanh(sum)
      // outputs[outputN] = !binary ? NN.tanh(sum) : NN.RELU(sum)

      // If not binary (such as hidden layers) use tanh
      // if (!binary) {
      //   // tanh
      //   outputs[outputN] = NN.tanh(sum)
     
      // // Use binary for outputs since for them it has to be either a 0 or 1.
      // } else {
      //   // In drones, don't do tanh
      //   // layer.outputs[outputN] = NN.tanh(sum+layer.biases[outputN])
      //   outputs[outputN] = NN.RELU(sum)
      //   // layer.outputs[outputN] = sum+layer.biases[outputN]
      // }

    }

    return outputs;
  }
}

class drone {
  constructor(
    x=Math.random()*windowWidth/2+windowWidth/4,
    y=Math.random()*windowHeight/2+windowHeight/4
  ) {
    this.pos = [x,y];
    this.vel = [0,0];
    this.acc = [0,0];

    this.width = 75;
    this.height = 25;
    
    this.angle = 0;
    this.angular_velocity = 0;

    this.stage = 0;
    this.time = 0;
    this.goalball = new goal();
    this.goalball.pos = stages[this.stage];

    this.dead = false;

    this.timeOut = 0;


    // Each drone will have 2 thrusters
    this.thrusters = [
      new thruster(this.pos[0]-this.width/2, this.pos[1]),
      new thruster(this.pos[0]+this.width/2, this.pos[1])
    ]
   
    this.color = "gray";
   
    this.fitness = 0;

    // Brain is a neural network with 4 inputs, 2 hidden layers of size 4 each, and 4 outputs.
    // INPUTS: to target x/y, vel x/y, cos angle of drone, sin angle of drone, angular velocity of drone
    // OUTPUTS: 4 values representing power/angle.
    
    const brain = [7, 9, 9, 4];
    
    // let brain = [7, 3, 4];
    // const rand = Math.random();
    // if (rand < .33) brain = [7, 9, 9, 4]
    // else if (rand < .66) brain = [7, 9, 9, 9, 4]

    // let brain = NN.createRandomNN(1, 3, 2, 10);
    // brain.unshift(7);
    // brain.push(4);

    this.brain = new NN(brain);
  }

  move(i) {

    // New Inputs:
    // 0: Power for thruster 0 (0 => 1)
    // 1: Angle for thruster 0 (-1 => 1)
    // 2: Power for thruster 0 (0 => 1)
    // 3: Angle for thruster 0 (-1 => 1)

    // SEND ALL THIS TO THRUSTERS
    const left = this.thrusters[0]
    const right = this.thrusters[1]

    left.setPower((i[0] + 1) * 0.5);
    left.setAngle(i[1]);

    right.setPower((i[2] + 1) * 0.5);
    right.setAngle(i[3]);

    this.acc = [0,0]

    // console.log(this.getThrust())

    // gravity
    this.acc[1] = .05;

    this.acc[0] += this.getThrust()[0];
    this.acc[1] += this.getThrust()[1];

    this.angular_velocity += this.getTorque();
		this.angle += this.angular_velocity * deltaTime;

    // normalize angle
    this.angle %= Math.PI * 2;

    // Update velocity
    this.vel[0] += this.acc[0];
    this.vel[1] += this.acc[1];

    // Update position
    this.pos[0] += this.vel[0] * deltaTime;
    this.pos[1] += this.vel[1] * deltaTime;
  }

  update() {

    // Keep the thrusters on the drone
    // this.thrusters[0].pos = [this.pos[0]-this.width/2, this.pos[1]]
    // this.thrusters[1].pos = [this.pos[0]+this.width/2, this.pos[1]]

    // difference in x and y
    // this.goalball.pos = stages[this.stage];
    const goalx = this.goalball.pos[0];
    const goaly = this.goalball.pos[1];
    const dx = goalx - this.pos[0];
    const dy = goaly - this.pos[1];

    // Penalize if too far
    // this.fitness -= Math.sqrt( dx**2 + dy**2 );

    // Penalize for high angular velocity
    // this.fitness -= this.angular_velocity;

    // INPUTS: to target x/y, vel x/y, cos angle of drone, sin angle of drone, angular velocity of drone
    this.move(NN.feedForward([
      dx/windowWidth, dy/windowHeight, //to target x/y
      this.vel[0], this.vel[1], //vel x/y
      Math.cos(this.angle), Math.sin(this.angle), // cos angle of drone, sin angle of drone
      this.angular_velocity, // angular velocity of drone
    ], 
    this.brain));


    // console.log(NN.feedForward([normalizedX, normalizedY, goalx/windowWidth, goaly/windowHeight], this.brain));
    // console.log(this.brain)
  }

  getTorque() {
    const inertia_coef = .8;
    const thruster_offset = this.width/2;

		const angle_left =  this.thrusters[0].angle - (Math.PI/2);
    const left_torque = this.thrusters[0].getPower() / thruster_offset * 
    cross(
      [Math.cos(angle_left), Math.sin(angle_left)], 
      [1.0, 0.0]
    );

		const angle_right = this.thrusters[1].angle - (Math.PI/2);
    const right_torque = this.thrusters[1].getPower() / thruster_offset * 
    cross(
      [Math.cos(angle_right), Math.sin(angle_right)], 
      [-1.0, 0.0]
    );


		return (left_torque + right_torque) * inertia_coef;
  }

  getThrust() {
    const left = this.thrusters[0];
    const right = this.thrusters[1];

		const angle_left = this.angle + left.angle - (Math.PI/2);
	  const thrust_left = mulVector([left.getPower(), left.getPower()], [Math.cos(angle_left), Math.sin(angle_left)]);

		const angle_right = this.angle + right.angle - (Math.PI/2);
		const thrust_right = mulVector([right.getPower(), right.getPower()], [Math.cos(angle_right), Math.sin(angle_right)]);

    // debugger
		return addVector(thrust_left, thrust_right);
	}

  draw(best) {
    ctx.save();

    ctx.translate(this.pos[0], this.pos[1])

    ctx.rotate(this.angle);

    // ctx.fillStyle = best ? "gold" : this.color;
    rect(-this.width/2, -this.height/2, this.width, this.height, best ? "gold" : this.color);

    this.thrusters[0].draw([-this.width/2, 0]);
    this.thrusters[1].draw([+this.width/2, 0]);

    ctx.restore();
  }
}

class thruster {
  constructor(x,y) {
    this.pos = [x,y];

    this.power_ratio = 0; // output of AI will be 0-1; so from 0 to max_power
    this.max_power = .075; // acc

		this.angle = 0; // Angle of each thruster
		// this.max_angle = 3/4 * Math.PI; // Max left half PI and max right half PI
		this.max_angle = 1; // Max left half PI and max right half PI
		this.target_angle = 0;
		this.angle_var_speed = 1; // How fast the thruster can rotate
		this.angle_ratio = 0;

    this.width = 20;
    this.height = 50;
  }

  setAngle(ratio) {
    this.target_angle = this.max_angle * Math.max(-1.0, Math.min(1.0, ratio));
  }

  setPower(ratio) {
    this.power_ratio = Math.max(0.0, Math.min(1.0, ratio));
  }

  getPower() {
    return this.power_ratio * this.max_power;
  }

  update() {
    const speed = this.angle_var_speed;
    this.angle += speed * (this.target_angle - this.angle);
    this.angle_ratio = this.angle / this.max_angle;
  }

  draw(pos) {
    ctx.save();

    ctx.translate(pos[0], pos[1])
    
    ctx.rotate(this.target_angle);
    // Main thruster body
    rect(
      -this.width/2, 
      -this.height/2, 
      this.width, 
      this.height, 
      "gray"
    )


    // Flame
    ctx.translate(-this.width*2/2, +this.height/2.5)
    ctx.drawImage(flame, 0, 0, this.width*2, this.getPower()*flame.height)

    ctx.restore();

  }
}

function pickTwoParents() {
  // Build cumulative fitness array
  const cumulative = [0];
  for (let i = 0; i < drones.length; i++) {
    cumulative.push(cumulative[i] + drones[i].fitness);
  }

  const totalFitness = cumulative[cumulative.length - 1];

  function pickOne() {
    const r = Math.random() * totalFitness;

    // Binary search
    let low = 0;
    let high = 0.05 * drones.length;

    while (low < high - 1) {
      const mid = (low + high) >> 1;
      if (cumulative[mid] < r) low = mid;
      else high = mid;
    }

    return bestAgents[(low + high) >> 1];
  }

  return [pickOne(), pickOne()];
}

function tournamentPick(pop, k = 3) {
  let best = null;

  for (let i = 0; i < k; i++) {
    const candidate = pop[Math.floor(Math.random() * pop.length)];
    if (!best || candidate.fitness > best.fitness) {
      best = candidate;
    }
  }

  return best;
}

function pick() {
  // 1. Calculate the combined fitness sum of the entire pool
  const totalFitness = drones.reduce((sum, d) => sum + d.fitness, 0);
  
  // 2. Spin the wheel to get a target value
  const target = Math.random() * totalFitness;
  
  // 3. Accumulate scores until you hit the target
  let runningSum = 0;
  for (let i = 0; i < drones.length; i++) {
    runningSum += drones[i].fitness;
    if (runningSum >= target) {
      return drones[i];
    }
  }
  
  // Fallback in case of tiny floating-point rounding errors
  return drones[drones.length - 1];
}
